version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - gosec
  exclusions:
    paths:
      - internal/store/db # generated by sqlc
    rules:
      # Test fixtures hold made-up passwords, hashes and cookies on purpose.
      - path: _test\.go
        linters: [gosec]
        text: "G101|G124"

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/store/db
