# Netscribe with nmap, for discovery.nmap. A complete file, use it instead of compose.yaml:
#
#   docker compose -f deploy/compose.nmap.yaml up --build -d
#
# Differences from compose.yaml:
#  - the image has nmap, and nmap has file capabilities (cap_net_raw, cap_net_admin)
#  - the container gets those capabilities back with cap_add
#  - "no-new-privileges" is not set, because the kernel ignores file capabilities when
#    it is on, and nmap would fail to open its raw sockets
# Everything else is the same: non-root user, read-only root filesystem, host network.
name: netscribe

services:
  netscribe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: nmap
    image: netscribe:nmap
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_RAW, NET_ADMIN, NET_BIND_SERVICE]
    read_only: true
    tmpfs: [/tmp]
    group_add: ["${DOCKER_GID:-999}"]
    # Turn nmap on for every scan with discovery.nmap: true in your config, or tick the
    # box next to "Run scan" in the panel for one scan. See compose.yaml for the config.
    command: ["serve", "--allow-loose-permissions"]
    volumes:
      - data:/data
      - ${NETSCRIBE_CONFIG:-../netscribe.example.yaml}:/data/netscribe.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
