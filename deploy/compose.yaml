# Run Netscribe next to the network it documents.
#
#   docker compose -f deploy/compose.yaml up --build -d
#
# The service uses the host network, because ARP and port scans must reach the LAN.
# It listens on 127.0.0.1:8080 of the host unless the config says otherwise.
name: netscribe

services:
  netscribe:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: netscribe:local
    network_mode: host
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    # The container user needs the group that owns the Docker socket. Find it with:
    #   stat -c %g /var/run/docker.sock
    group_add: ["${DOCKER_GID:-999}"]
    # The mounted example config is world readable, which the service refuses by
    # default. Point NETSCRIBE_CONFIG at your own file (mode 0600, owned by uid 65532)
    # and remove the flag once you have one.
    command: ["serve", "--allow-loose-permissions"]
    volumes:
      - data:/data
      - ${NETSCRIBE_CONFIG:-../netscribe.example.yaml}:/data/netscribe.yaml:ro
      # Read-only does not limit what the Docker API allows, see README.md, "Security".
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  data:
