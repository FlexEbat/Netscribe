version: 2

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: netscribe
    main: ./cmd/netscribe
    binary: netscribe
    env:
      - CGO_ENABLED=0 # static binary: the SQLite driver is pure Go
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - id: netscribe
    formats: [tar.gz]
    name_template: "netscribe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - netscribe.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore"
