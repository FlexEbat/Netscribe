name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly: new advisories appear without any code change

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  SQLC_VERSION: v1.31.1
  GOVULNCHECK_VERSION: v1.8.0

jobs:
  # The gate is four jobs that run side by side and one small job, named gate, that waits for them:
  # the branch rule asks for the check called gate, and it is green only when all four are.
  lint:
    # gofmt, vet, golangci-lint, the sqlc check, eslint, prettier and the typecheck
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go version for the tool cache
        id: goversion
        run: echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache the lint and codegen tools
        id: tools
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/bin
          key: tools-${{ runner.os }}-${{ steps.goversion.outputs.version }}-golangci-${{ env.GOLANGCI_LINT_VERSION }}-sqlc-${{ env.SQLC_VERSION }}
      - name: Install lint and codegen tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
      - name: Lint and typecheck
        run: make lint check

  test-go:
    # the Go tests with the race detector
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Go tests
        run: make test-go

  test-web:
    # the tests of the web app
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web tests
        run: make test-web

  build:
    # dependencies verified and tidy, then a build of the single binary
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Dependencies are verified and tidy
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Build the binary
        run: |
          make build
          ./netscribe help

  gate:
    # the check the branch rule asks for
    if: always() && github.event_name != 'schedule'
    needs: [lint, test-go, test-web, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All four are green
        run: |
          echo "lint, test-go, test-web, build: ${{ join(needs.*.result, ', ') }}"
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"

  e2e:
    # real browser tests of the panel on a temporary server; no secret, no network but loopback
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Chromium for Playwright
        run: |
          npm --prefix web ci
          npx --prefix web playwright install --with-deps chromium
      - name: End to end tests
        run: make e2e
      - name: End to end tests on a large network
        run: make e2e-large
      - name: Start the lab network
        run: docker compose -f deploy/compose.lab.yaml up --build -d
      - name: End to end scan of the lab network
        run: make e2e-lab
      - name: Stop the lab network
        if: always()
        run: docker compose -f deploy/compose.lab.yaml down
      - name: Upload traces and screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-results
          path: web/e2e-results
          if-no-files-found: ignore

  oidc-dex:
    # single sign-on against a real identity provider (Dex in a container); loopback only
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sign in through Dex
        run: |
          npm --prefix web ci
          make oidc-dex

  oidc-keycloak:
    # single sign-on against a real identity provider (Keycloak in a container); loopback only
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sign in through Keycloak
        run: |
          npm --prefix web ci
          make oidc-keycloak

  oidc-authentik:
    # single sign-on against a real identity provider (Authentik in containers); loopback only
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Sign in through Authentik
        run: |
          npm --prefix web ci
          make oidc-authentik

  docker:
    # the images are built here and nowhere else, so a broken Dockerfile would show only
    # when somebody tries to run it
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the default image
        run: docker build -f deploy/Dockerfile -t netscribe:ci .
      - name: Build the image with nmap
        run: docker build -f deploy/Dockerfile --target nmap -t netscribe:ci-nmap .
      - name: The image runs
        run: docker run --rm netscribe:ci version

  audit:
    # known vulnerabilities in dependencies, needs the network
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm --prefix web ci
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
      - name: Audit
        # The advisory databases are fetched over the network. A failed fetch is tried
        # again, a real finding fails every attempt.
        run: |
          for attempt in 1 2 3; do
            make audit && exit 0
            echo "audit attempt $attempt failed"
            sleep 20
          done
          exit 1

  secrets:
    # leaked credentials anywhere in the history
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
