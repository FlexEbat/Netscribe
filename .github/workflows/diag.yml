name: diag

# Temporary: runs vet and the tests on dev and shows the failures as annotations.
on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web interface
        run: make web/dist web/node_modules
      - name: Vet and test
        run: |
          set +e
          go vet ./... > vet.txt 2>&1
          go test -race ./... > test.txt 2>&1
          (cat vet.txt; grep -v '^ok\|no test files' test.txt) | head -c 6000 > summary.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' summary.txt)
          echo "::error title=diag::${msg}"
          exit 0
