name: Verify slice 16
on:
  pull_request:
permissions:
  contents: read
jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build and start
        run: |
          export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          docker compose -f deploy/compose.yaml up --build -d
      - name: healthz is 200 and the rest is 503
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)
            [ "$code" = 200 ] && break
            sleep 2
          done
          echo "healthz $code"; [ "$code" = 200 ]
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/devices)
          echo "api before user: $api"; [ "$api" = 503 ]
      - name: First user
        run: |
          echo 'correct horse battery staple' | docker compose -f deploy/compose.yaml exec -T netscribe netscribe user add alice --role admin --password-stdin --allow-loose-permissions
          api=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/devices)
          echo "api after user: $api"; [ "$api" = 401 ]
      - name: Container hardening
        run: |
          docker compose -f deploy/compose.yaml exec -T netscribe netscribe devices --allow-loose-permissions
          docker inspect netscribe-netscribe-1 --format '{{.HostConfig.ReadonlyRootfs}} {{.HostConfig.CapDrop}} {{.HostConfig.SecurityOpt}} {{.Config.User}}'
      - if: failure()
        run: docker compose -f deploy/compose.yaml logs
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: build --snapshot --clean
      - name: Static linux binaries
        run: |
          find dist -type f -name netscribe | while read f; do file "$f"; ldd "$f" 2>&1 || true; done
          test "$(find dist -type f -name netscribe | wc -l)" = 2
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - run: docker compose -f deploy/compose.lab.yaml up --build -d
      - run: sleep 5
      - run: go test -tags lab -count=1 -v ./cmd/netscribe -run Lab
      - if: failure()
        run: docker compose -f deploy/compose.lab.yaml logs
