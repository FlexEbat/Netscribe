name: Probe nmap
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install nmap and start the lab
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap >/dev/null
          docker compose -f deploy/compose.lab.yaml up --build -d
          sleep 6
          echo "::notice title=nmap version::$(nmap --version | head -2 | tr '\n' ' ')"
      - name: Without capabilities, as a normal user
        run: |
          set +e
          nmap -O -n -Pn --privileged --top-ports 100 --host-timeout 60s -oX - 172.30.0.12 >/tmp/a.xml 2>/tmp/a.err
          code=$?
          echo "::notice title=no caps exit::$code stderr: $(head -c 300 /tmp/a.err | tr '\n' ' ')"
      - name: With capabilities
        run: |
          set +e
          sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip "$(command -v nmap)"
          for ip in 172.30.0.12 172.30.0.11 172.30.0.10; do
            nmap -O -n -Pn --privileged --top-ports 100 --host-timeout 60s -oX - $ip >/tmp/b.xml 2>/tmp/b.err
            code=$?
            os=$(grep -o '<osmatch [^>]*>\|<osclass [^>]*>' /tmp/b.xml | head -8 | tr '\n' '|')
            echo "::notice title=caps $ip exit $code::$os stderr: $(head -c 200 /tmp/b.err | tr '\n' ' ') size: $(wc -c </tmp/b.xml) hasos: $(grep -c '<os>' /tmp/b.xml)"
          done
          echo "::notice title=head of xml::$(head -c 700 /tmp/b.xml | tr '\n' ' ')"
