name: Verify slice 19
on:
  pull_request:
permissions:
  contents: read
jobs:
  lab-nmap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Real nmap against the lab
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap >/dev/null
          sudo setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip "$(command -v nmap)"
          docker compose -f deploy/compose.lab.yaml up --build -d
          sleep 6
          set +e
          NETSCRIBE_LAB_NMAP=1 go test -tags lab -count=1 -v ./cmd/netscribe -run Lab 2>&1 | tee /tmp/t.txt
          code=${PIPESTATUS[0]}
          echo "::notice title=lab go test exit $code::$(head -c 3000 /tmp/t.txt | tr '\n' '|')"
          exit $code
  docker-nmap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Default image still builds and is the distroless one
        run: |
          docker build -f deploy/Dockerfile -t netscribe:default .
          echo "::notice title=default image::$(docker image inspect netscribe:default --format '{{.Config.User}} {{.Config.Entrypoint}}')"
      - name: Nmap variant
        run: |
          export DOCKER_GID=$(stat -c %g /var/run/docker.sock)
          docker compose -f deploy/compose.lab.yaml up --build -d
          docker compose -f deploy/compose.nmap.yaml up --build -d
          sleep 6
          set +e
          docker compose -f deploy/compose.nmap.yaml exec -T netscribe id > /tmp/id.txt 2>&1
          docker compose -f deploy/compose.nmap.yaml exec -T netscribe nmap -O -n -Pn --privileged --top-ports 100 -oX - 172.30.0.12 > /tmp/n.xml 2>/tmp/n.err
          c1=$?
          docker compose -f deploy/compose.nmap.yaml exec -T netscribe netscribe scan --nmap 172.30.0.0/24 --allow-loose-permissions > /tmp/s.txt 2>&1
          c2=$?
          echo "::notice title=nmap variant::id: $(cat /tmp/id.txt | tr '\n' ' ') nmap exit $c1 stderr: $(head -c 200 /tmp/n.err | tr '\n' ' ') os: $(grep -o '<osmatch [^>]*>' /tmp/n.xml | head -2 | tr '\n' '|') scan exit $c2: $(head -c 400 /tmp/s.txt | tr '\n' '|')"
          [ $c1 -eq 0 ] && grep -q '<osmatch' /tmp/n.xml && [ $c2 -eq 0 ]
