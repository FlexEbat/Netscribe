name: Probe tests
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: mkdir -p web/dist && touch web/dist/.gitkeep
      - name: Tests with their failures in annotations
        run: |
          set +e
          go vet ./... > /tmp/v.txt 2>&1
          echo "::notice title=vet::exit $? $(head -c 800 /tmp/v.txt | tr '\n' '|')"
          gofmt -l cmd internal > /tmp/g.txt 2>&1
          echo "::notice title=gofmt::$(head -c 400 /tmp/g.txt | tr '\n' '|') end"
          go test -race -count=1 ./... 2>&1 | tee /tmp/t.txt
          grep -E "^(--- FAIL|FAIL|panic|WARNING: DATA RACE)|_test.go:[0-9]+|^ok" /tmp/t.txt | head -c 3500 | tr '\n' '|' > /tmp/f.txt
          echo "::notice title=go test race::$(cat /tmp/f.txt) end"
          exit 0
