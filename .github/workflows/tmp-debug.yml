name: tmpdebug
on:
  pull_request:
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: report
        continue-on-error: true
        run: |
          mkdir -p web/dist && touch web/dist/.gitkeep
          note() { printf '::error title=%s::%s\n' "$1" "$(head -c 6000 | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          gofmt -l internal cmd 2>&1 | note gofmt
          go vet ./... 2>&1 | note vet
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 2>&1 | tail -2
          "$(go env GOPATH)/bin/golangci-lint" run ./... 2>&1 | note lint
          go test -race ./... 2>&1 | grep -v '^ok\|no test files' | note test
