name: tmpdebug
on:
  pull_request:
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: report
        continue-on-error: true
        run: |
          mkdir -p web/dist && touch web/dist/.gitkeep
          note() { printf '::error title=%s::%s\n' "$1" "$(head -c 7000 | sed ':a;N;$!ba;s/\n/%0A/g')"; }
          go test -race ./... 2>&1 | grep -v '^ok\|no test files' | grep -v '^\s*#[0-9]\|Crash keys\|"switch-\|"commandline\|"num-switches\|"osarch\|"pid\|"ptype' | note test
