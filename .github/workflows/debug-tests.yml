name: debug-tests
on:
  push:
    branches: [feat/steadier-alerts]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: tests, failures as annotations
        run: |
          mkdir -p web/dist && touch web/dist/.keep
          go test ./... 2>&1 | tee /tmp/out.txt || true
          grep -E "^(--- FAIL|FAIL|panic:)|_test.go:[0-9]+:" /tmp/out.txt | head -30 | while read -r l; do echo "::error::${l:0:400}"; done
