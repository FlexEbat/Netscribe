# Temporary: runs go mod tidy with network access, then the gate, and publishes the logs.
name: Bootstrap

on: workflow_dispatch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: go mod tidy and commit go.mod, go.sum
        run: |
          go mod tidy 2>&1 | tee tidy.log || true
          if ! git diff --quiet -- go.mod go.sum; then
            git config user.name FlexEbat
            git config user.email 52438328+FlexEbat@users.noreply.github.com
            git add go.mod go.sum
            git commit -m "chore(config): update go.mod and go.sum"
            git push origin HEAD:main
          fi
      - name: Gate
        run: |
          set +e
          make gate > gate.log 2>&1
          echo $? > gate.code
      - name: Audit
        run: |
          set +e
          make audit > audit.log 2>&1
          echo $? > audit.code
      - name: Publish logs to the ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir /tmp/logs
          cp tidy.log gate.log gate.code audit.log audit.code /tmp/logs/ 2>/dev/null || true
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=FlexEbat -c user.email=52438328+FlexEbat@users.noreply.github.com commit -qm "ci logs"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
